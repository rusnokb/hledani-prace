name: Aktualizace seznamu organizací

on:
  schedule:
    - cron: "0 3 1 */3 *"   # 1. den každého třetího měsíce
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sestavit seznam a dohledat weby
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/targets.py --search --limit 120
      - name: Uložit
        run: |
          git config user.name "job-seeker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/targets.json
          git diff --cached --quiet || git commit -m "Aktualizace seznamu organizací $(date +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done

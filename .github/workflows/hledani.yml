name: Hledání nabídek práce

on:
  schedule:
    - cron: "0 4 * * 1,4"   # pondělí a čtvrtek v 6:00 SELČ (5:00 SEČ)
  workflow_dispatch:         # ruční spuštění tlačítkem „Run workflow“

permissions:
  contents: write

concurrency:
  group: hledani
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hledání
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFIL_MD: ${{ secrets.PROFIL_MD }}
        run: python src/main.py
      - name: Uložit výsledky
        run: |
          git config user.name "job-seeker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json data/web_cache.json docs
          git diff --cached --quiet || git commit -m "Aktualizace nabídek $(date +%F)"
          git push
